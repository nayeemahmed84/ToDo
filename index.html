<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fast, offline-ready tasks & shared lists across all your devices" />
    <meta name="theme-color" content="#202020" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="To Do" />
    <meta name="application-name" content="To Do" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>To Do</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <script>
      (function () {
        var html = document.documentElement;
        var dark = true;
        try {
          var storedSettings = localStorage.getItem('todo-settings');
          if (storedSettings) {
            var settings = JSON.parse(storedSettings);
            if (settings.themeMode === 'dark') dark = true;
            else if (settings.themeMode === 'light') dark = false;
            else if (settings.themeModeExplicit) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            else dark = true;
          } else {
            var storedDark = localStorage.getItem('todo-dark');
            dark = storedDark !== null
              ? storedDark === '1'
              : true;
          }
        } catch {
          dark = true;
        }
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute('content', dark ? '#202020' : '#4A6CF7');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
