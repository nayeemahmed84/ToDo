name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint source and tests
        run: npm run lint

      - name: Run unit & worker tests
        run: npm test

      - name: Type-check Cloudflare reminder worker
        run: npm run typecheck:worker

      - name: Build production app
        run: npm run build

      - name: Install Playwright Chromium & run E2E smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Run Firestore security rules tests
        run: npm run test:rules
